# Server Configuration
server.port=8080

# MongoDB Configuration - EXPLICIT ATLAS CONNECTION
spring.data.mongodb.uri=${MONGODB_URI}

# DISABLE LOCAL MONGODB - FORCE ATLAS ONLY
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=medication_tracker_project

# MongoDB Connection Settings
spring.data.mongodb.client-uri=${MONGODB_URI}



# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

# Logging Configuration
logging.level.com.medtracker=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.mongodb.driver=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174,http://localhost:8081
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
